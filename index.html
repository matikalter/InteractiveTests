<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Globe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    canvas { display: block; touch-action: none; }

    /* ── Base button ─────────────────────────────────────────────────── */
    .btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.4);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: opacity .2s, border-color .25s, color .25s;
    }
    .btn:active { opacity: .4 !important; }

    /* ── Right column (position: fixed) ─────────────────────────────── */
    #invertBtn { position: fixed; bottom: 74px; right: 22px; opacity: .75; }
    #resetBtn  { position: fixed; bottom: 22px; right: 22px; opacity: .75; }

    /* ── Left column: cockroach rows (button + label) ────────────────── */
    .roach-row {
      position: fixed;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #row-german      { bottom: 178px; }
    #row-american    { bottom: 126px; }
    #row-oriental    { bottom:  74px; }
    #row-brownbanded { bottom:  22px; }

    /* Cockroach button states */
    .roach-btn { opacity: .35; }
    .roach-btn.active { opacity: 1 !important; }

    /* Species label — shown inline to the right of the button */
    .species-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      font-style: italic;
      letter-spacing: 0.03em;
      white-space: nowrap;
      pointer-events: none;           /* ignore events when invisible */
      user-select: none;              /* prevent text selection on long-press */
      -webkit-user-select: none;
      -webkit-touch-callout: none;    /* suppress iOS copy/paste popover */
      opacity: 0;
      transition: opacity .25s;
      /* color set by JS to match species */
    }
    .species-label.visible {
      opacity: 1;
      pointer-events: auto;           /* allow hover / touch when visible */
    }

    /* ── Info box ────────────────────────────────────────────────────── */
    #info-box {
      position: fixed;
      top: 22px;
      left: 22px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.03em;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s;
      max-width: 200px; /* overridden dynamically by JS */
    }
    #info-box.visible { opacity: 1; }
    #info-name { font-weight: 600; }

    /* ── Light theme ─────────────────────────────────────────────────── */
    body.light { background: #fff; }
    body.light #invertBtn,
    body.light #resetBtn {
      border-color: rgba(0,0,0,0.45);
      background: rgba(255,255,255,0.4);
      color: #000;
    }

    /* ── Loading indicator ───────────────────────────────────────────── */
    #loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    #loader span {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px; letter-spacing: .1em;
      color: rgba(255,255,255,.3);
      text-transform: uppercase;
    }
    body.light #loader span { color: rgba(0,0,0,.25); }
    #loader.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loader"><span>loading</span></div>
  <div id="info-box"><strong id="info-name"></strong><span id="info-sep"> — </span><span id="info-desc"></span></div>

  <!-- ── Left column: cockroach species rows (rank 1 top → rank 4 bottom) ── -->

  <div class="roach-row" id="row-german">
    <button class="btn roach-btn" id="btn-german" aria-label="German cockroach">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="8"    y1="4.5"  x2="3"    y2="1"    stroke="currentColor" stroke-width="1"/>
        <line x1="10"   y1="4.5"  x2="15"   y2="1"    stroke="currentColor" stroke-width="1"/>
        <ellipse cx="9" cy="12"   rx="3"    ry="4.5"   stroke="currentColor" stroke-width="1"/>
        <line x1="7.5"  y1="8"    x2="7.5"  y2="11"   stroke="currentColor" stroke-width="0.9"/>
        <line x1="10.5" y1="8"    x2="10.5" y2="11"   stroke="currentColor" stroke-width="0.9"/>
      </svg>
    </button>
    <span class="species-label" id="label-german">Blattella germanica</span>
  </div>

  <div class="roach-row" id="row-american">
    <button class="btn roach-btn" id="btn-american" aria-label="American cockroach">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="8"    y1="4"    x2="1.5"  y2="1"    stroke="currentColor" stroke-width="1"/>
        <line x1="10"   y1="4"    x2="16.5" y2="1"    stroke="currentColor" stroke-width="1"/>
        <ellipse cx="9" cy="11.5" rx="4"    ry="5"    stroke="currentColor" stroke-width="1"/>
        <ellipse cx="9" cy="8"    rx="2.2"  ry="1.3"  stroke="currentColor" stroke-width="0.9"/>
      </svg>
    </button>
    <span class="species-label" id="label-american">Periplaneta americana</span>
  </div>

  <div class="roach-row" id="row-oriental">
    <button class="btn roach-btn" id="btn-oriental" aria-label="Oriental cockroach">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="8"    y1="7.5"  x2="5.5"  y2="5"    stroke="currentColor" stroke-width="1"/>
        <line x1="10"   y1="7.5"  x2="12.5" y2="5"    stroke="currentColor" stroke-width="1"/>
        <ellipse cx="9" cy="12"   rx="4"    ry="4"     stroke="currentColor" stroke-width="1"/>
      </svg>
    </button>
    <span class="species-label" id="label-oriental">Blatta orientalis</span>
  </div>

  <div class="roach-row" id="row-brownbanded">
    <button class="btn roach-btn" id="btn-brownbanded" aria-label="Brown-banded cockroach">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="8.5"  y1="5"    x2="5"    y2="2"    stroke="currentColor" stroke-width="1"/>
        <line x1="9.5"  y1="5"    x2="13"   y2="2"    stroke="currentColor" stroke-width="1"/>
        <ellipse cx="9" cy="11.5" rx="3.2"  ry="4.5"  stroke="currentColor" stroke-width="1"/>
        <line x1="6.4"  y1="9"    x2="11.6" y2="9"    stroke="currentColor" stroke-width="0.9"/>
        <line x1="6.0"  y1="12"   x2="12.0" y2="12"   stroke="currentColor" stroke-width="0.9"/>
      </svg>
    </button>
    <span class="species-label" id="label-brownbanded">Supella longipalpa</span>
  </div>

  <!-- ── Right column ───────────────────────────────────────────────── -->
  <button class="btn" id="invertBtn" aria-label="Invert colors">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1"/>
      <path d="M9 1.5 A7.5 7.5 0 0 1 9 16.5 Z" fill="currentColor"/>
    </svg>
  </button>

  <button class="btn" id="resetBtn" aria-label="Reset orientation">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1"/>
      <circle cx="9" cy="9" r="2"   stroke="currentColor" stroke-width="1"/>
      <line x1="9" y1="1.5"  x2="9" y2="5.5"  stroke="currentColor" stroke-width="1"/>
      <line x1="9" y1="12.5" x2="9" y2="16.5" stroke="currentColor" stroke-width="1"/>
      <line x1="1.5"  y1="9" x2="5.5"  y2="9" stroke="currentColor" stroke-width="1"/>
      <line x1="12.5" y1="9" x2="16.5" y2="9" stroke="currentColor" stroke-width="1"/>
    </svg>
  </button>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════════════
   Interactive Wireframe Globe
   Three.js r160 · world-atlas 2 · topojson-client 3 · GBIF occurrence API
   ═══════════════════════════════════════════════════════════════════════════ */

import * as THREE   from 'https://esm.sh/three@0.160.0';
import { mesh }     from 'https://esm.sh/topojson-client@3';

// ── Config ───────────────────────────────────────────────────────────────────
const GLOBE_R  = 1;
const LINE_R   = 1.002;
const DOT_R    = 1.005;
const FOV      = 45;
const ZOOM_MAX = 4.0;
const fovRad   = FOV * (Math.PI / 180);

// ── Species info ─────────────────────────────────────────────────────────────
const SPECIES_INFO = {
  german:      { common: 'German Cockroach',       desc: 'The most widespread indoor cockroach worldwide. Thrives in warm, humid environments near food and moisture. Responsible for most household infestations across every continent.' },
  american:    { common: 'American Cockroach',     desc: 'The largest common house-infesting species. Originally from Africa, now found globally in sewers, basements, and warm buildings. Fast-moving and capable of short gliding flight.' },
  oriental:    { common: 'Oriental Cockroach',     desc: 'Often called the "black beetle." Prefers cool, damp conditions and is common in basements, drains, and leaf litter. Less heat-tolerant than other pest species.' },
  brownbanded: { common: 'Brown-banded Cockroach', desc: 'Identified by light bands across its wings. Favours warm, dry areas high up in rooms and inside furniture. Spreads easily through infested goods and electronics.' },
};

// ── Species ───────────────────────────────────────────────────────────────────
const SPECIES = [
  { key: 'german',      name: 'Blattella germanica',   color: '#E8924A', threeColor: 0xE8924A },
  { key: 'american',    name: 'Periplaneta americana',  color: '#72B87A', threeColor: 0x72B87A },
  { key: 'oriental',    name: 'Blatta orientalis',      color: '#6098B8', threeColor: 0x6098B8 },
  { key: 'brownbanded', name: 'Supella longipalpa',     color: '#C4A060', threeColor: 0xC4A060 },
];

// ── GBIF cache ────────────────────────────────────────────────────────────────
const CACHE_KEY = 'globe_roach_v2';   // bump version to invalidate old cache
const CACHE_TTL = 7 * 24 * 60 * 60 * 1000;

function cacheGet() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    return (Date.now() - ts < CACHE_TTL) ? data : null;
  } catch { return null; }
}
function cacheSet(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
}

// ── GBIF fetch — 5 pages × 300 = up to 1500 records per species ──────────────
// hasGeospatialIssue=false filters out records with known coordinate errors
// occurrenceStatus=PRESENT excludes absence records
async function fetchSpecies(scientificName) {
  const LIMIT = 300, PAGES = 5;
  const pages = await Promise.all(
    Array.from({ length: PAGES }, (_, i) =>
      fetch(
        `https://api.gbif.org/v1/occurrence/search` +
        `?scientificName=${encodeURIComponent(scientificName)}` +
        `&hasCoordinate=true&hasGeospatialIssue=false&occurrenceStatus=PRESENT` +
        `&limit=${LIMIT}&offset=${i * LIMIT}`
      )
      .then(r => r.json())
      .then(j => (j.results || [])
        .filter(r => r.decimalLatitude != null && r.decimalLongitude != null)
        .map(r => [+r.decimalLatitude, +r.decimalLongitude])
      )
      .catch(() => [])
    )
  );
  return pages.flat();
}

// ── Renderer ─────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.05, 200);

// ── Globe group ──────────────────────────────────────────────────────────────
const globe = new THREE.Group();
scene.add(globe);

const sphereMat  = new THREE.MeshBasicMaterial({ color: 0x000000 });
const sphereMesh = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_R, 72, 72), sphereMat);
sphereMesh.renderOrder = 0;
globe.add(sphereMesh);

const borderMat = new THREE.LineBasicMaterial({ color: 0xffffff });

// ── Silhouette ring ───────────────────────────────────────────────────────────
const outlineMat = new THREE.LineBasicMaterial({ color: 0xffffff, depthTest: false, depthWrite: false });
const outlinePts = new Float32Array(257 * 3);
for (let i = 0; i <= 256; i++) {
  const a = (i / 256) * Math.PI * 2;
  outlinePts[i * 3] = Math.cos(a); outlinePts[i * 3 + 1] = Math.sin(a);
}
const outlineGeo  = new THREE.BufferGeometry();
outlineGeo.setAttribute('position', new THREE.Float32BufferAttribute(outlinePts, 3));
const outlineRing = new THREE.LineLoop(outlineGeo, outlineMat);
outlineRing.renderOrder = 10;
scene.add(outlineRing);

// ── Coordinate helper ────────────────────────────────────────────────────────
function ll3(lat, lon, r) {
  const φ = lat * (Math.PI / 180), λ = lon * (Math.PI / 180);
  return [r * Math.cos(φ) * Math.sin(λ), r * Math.sin(φ), r * Math.cos(φ) * Math.cos(λ)];
}

// ── Geography loader ──────────────────────────────────────────────────────────
async function loadGeo() {
  const res  = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
  const topo = await res.json();
  const lines = mesh(topo, topo.objects.countries);
  const verts = [];
  for (const ring of lines.coordinates) {
    for (let i = 0; i < ring.length - 1; i++) {
      const [ax,ay,az] = ll3(ring[i][1],   ring[i][0],   LINE_R);
      const [bx,by,bz] = ll3(ring[i+1][1], ring[i+1][0], LINE_R);
      verts.push(ax,ay,az, bx,by,bz);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const segs = new THREE.LineSegments(geo, borderMat);
  segs.renderOrder = 1;
  globe.add(segs);
  document.getElementById('loader').classList.add('hidden');
}

// ── Dot layers ────────────────────────────────────────────────────────────────
const dotLayers  = {};                 // key → THREE.Points
const activeKeys = new Set();          // independently-toggled species

function buildDotLayer(sp, coords) {
  // Remove old layer if rebuilding from a fresh fetch
  if (dotLayers[sp.key]) {
    globe.remove(dotLayers[sp.key]);
    dotLayers[sp.key].geometry.dispose();
    dotLayers[sp.key].material.dispose();
  }
  const positions = new Float32Array(coords.length * 3);
  for (let i = 0; i < coords.length; i++) {
    const [x, y, z] = ll3(coords[i][0], coords[i][1], DOT_R);
    positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: sp.threeColor, size: 2, sizeAttenuation: false });
  const pts = new THREE.Points(geo, mat);
  pts.renderOrder = 2;
  pts.visible = activeKeys.has(sp.key);
  globe.add(pts);
  dotLayers[sp.key] = pts;
}

// ── Species data loading (hybrid cache) ───────────────────────────────────────
async function loadSpeciesData() {
  const cached = cacheGet();
  if (cached) {
    for (const sp of SPECIES) {
      if (cached[sp.key]?.length) buildDotLayer(sp, cached[sp.key]);
    }
  }
  // Always refresh in background; cache only suppresses the blocking wait
  refreshFromGBIF(cached !== null);
}

async function refreshFromGBIF(silent = false) {
  try {
    const results = await Promise.allSettled(SPECIES.map(sp => fetchSpecies(sp.name)));
    const data = {};
    for (let i = 0; i < SPECIES.length; i++) {
      const r = results[i];
      if (r.status === 'fulfilled' && r.value.length > 0) {
        data[SPECIES[i].key] = r.value;
        buildDotLayer(SPECIES[i], r.value);  // replaces layer with fresh data
      }
    }
    if (Object.keys(data).length > 0) cacheSet(data);
  } catch (err) {
    if (!silent) console.warn('GBIF fetch failed:', err);
  }
}

// ── Species selection ─────────────────────────────────────────────────────────
function syncSpeciesUI() {
  for (const sp of SPECIES) {
    const active = activeKeys.has(sp.key);
    if (dotLayers[sp.key]) dotLayers[sp.key].visible = active;
    document.getElementById(`btn-${sp.key}`).classList.toggle('active', active);
    document.getElementById(`label-${sp.key}`).classList.toggle('visible', active);
  }
}
function selectSpecies(key) {
  activeKeys.has(key) ? activeKeys.delete(key) : activeKeys.add(key);
  syncSpeciesUI();
}

// ── Info box ──────────────────────────────────────────────────────────────────
const infoBox  = document.getElementById('info-box');
const infoName = document.getElementById('info-name');
const infoDesc = document.getElementById('info-desc');

function showInfo(key) {
  const sp   = SPECIES.find(s => s.key === key);
  const info = SPECIES_INFO[key];
  infoName.textContent = info.common;
  infoDesc.textContent = info.desc;
  infoBox.style.color  = sp.color;
  updateInfoBoxWidth();
  infoBox.classList.add('visible');
}
function hideInfo() {
  infoBox.classList.remove('visible');
}
function updateInfoBoxWidth() {
  const portrait     = innerHeight > innerWidth;
  const globeScreenR = (portrait ? innerWidth : innerHeight) / 3;
  const globeLeft    = innerWidth / 2 - globeScreenR;
  const isCoarse     = window.matchMedia('(pointer: coarse)').matches;
  if (isCoarse) {
    // Mobile: same horizontal extent as the button column
    const row = document.querySelector('.roach-row');
    infoBox.style.maxWidth = (row ? row.offsetWidth : Math.floor(globeLeft * 2/3)) + 'px';
  } else {
    // Desktop: 2/3 of distance from left edge to globe left edge
    infoBox.style.maxWidth = Math.max(80, Math.floor(globeLeft * 2/3)) + 'px';
  }
}

// ── Button init: colors + desktop hover on label + mobile long-press on label ─
for (const sp of SPECIES) {
  const btn = document.getElementById(`btn-${sp.key}`);
  const lbl = document.getElementById(`label-${sp.key}`);
  btn.style.borderColor = sp.color;
  btn.style.color       = sp.color;
  lbl.style.color       = sp.color;

  // Button icon: click to toggle species (desktop + mobile)
  btn.addEventListener('click', () => selectSpecies(sp.key));

  // Desktop: hover over latin name (only reachable when active/visible) → info box
  lbl.addEventListener('mouseenter', () => showInfo(sp.key));
  lbl.addEventListener('mouseleave', hideInfo);

  // Mobile: long-press latin name → info box; release → hide
  // (user-select: none on label prevents text selection interfering)
  let pressTimer = null, pressX = 0, pressY = 0, wasLong = false;

  lbl.addEventListener('touchstart', e => {
    wasLong = false;
    pressX  = e.touches[0].clientX;
    pressY  = e.touches[0].clientY;
    pressTimer = setTimeout(() => {
      wasLong = true;
      showInfo(sp.key);
    }, 400);
  }, { passive: true });

  lbl.addEventListener('touchmove', e => {
    if (pressTimer &&
        (Math.abs(e.touches[0].clientX - pressX) > 8 ||
         Math.abs(e.touches[0].clientY - pressY) > 8)) {
      clearTimeout(pressTimer); pressTimer = null;
    }
  }, { passive: true });

  lbl.addEventListener('touchend', e => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (wasLong) hideInfo();
    e.preventDefault(); // suppress ghost click after long-press
  });
}

// ── Camera distance ───────────────────────────────────────────────────────────
function calcDefaultZ() {
  const portrait = innerHeight > innerWidth;
  const refDiam  = portrait ? innerWidth * (2/3) : innerHeight * (2/3);
  return GLOBE_R * innerHeight / (Math.tan(fovRad / 2) * refDiam);
}

// ── State ────────────────────────────────────────────────────────────────────
let defZ = calcDefaultZ(), tgtZ = defZ, curZ = defZ;
camera.position.z = curZ;

const globeQ     = new THREE.Quaternion();
let resetTargetQ = new THREE.Quaternion();
let resetting    = false, resetT = 0;
let resetFromQ   = new THREE.Quaternion(), resetFromZ = defZ;

let dragging = false, dragPx = 0, dragPy = 0;
let velDx = 0, velDy = 0;
const DAMPING = 0.92;

let pinchDist0 = 0, pinchAngle0 = 0, pinchZ0 = defZ;
let isLight = false;

function clampZ() { tgtZ = Math.max(defZ / ZOOM_MAX, Math.min(defZ, tgtZ)); }

// ── Rotation helpers ──────────────────────────────────────────────────────────
const _qX = new THREE.Quaternion(), _qY = new THREE.Quaternion(), _qZ = new THREE.Quaternion();
const _axX = new THREE.Vector3(1,0,0), _axY = new THREE.Vector3(0,1,0), _axZ = new THREE.Vector3(0,0,1);

function applyDrag(dx, dy) {
  const s = (Math.PI / Math.min(innerWidth, innerHeight)) * (curZ / defZ);
  _qY.setFromAxisAngle(_axY, dx * s); _qX.setFromAxisAngle(_axX, dy * s);
  globeQ.premultiply(_qY).premultiply(_qX);
  globe.quaternion.copy(globeQ);
}
function applyTwist(dAngle) {
  _qZ.setFromAxisAngle(_axZ, -dAngle);
  globeQ.premultiply(_qZ);
  globe.quaternion.copy(globeQ);
}
const touchDist  = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
const touchAngle = e => Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX);
function angleDelta(a, b) { let d = a-b; if (d>Math.PI) d-=2*Math.PI; if (d<-Math.PI) d+=2*Math.PI; return d; }

function computeSmartResetQ() {
  const lf = new THREE.Vector3(0,0,1).applyQuaternion(new THREE.Quaternion().copy(globeQ).invert());
  const q1 = new THREE.Quaternion().setFromUnitVectors(lf.normalize(), new THREE.Vector3(0,0,1));
  const n  = new THREE.Vector3(0,1,0).applyQuaternion(q1);
  const qZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), Math.atan2(n.x, n.y));
  return new THREE.Quaternion().multiplyQuaternions(qZ, q1);
}

// ── Events ────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  dragging = true; resetting = false; velDx = velDy = 0;
  dragPx = e.clientX; dragPy = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragPx, dy = e.clientY - dragPy;
  velDx = velDx*0.6 + dx*0.4; velDy = velDy*0.6 + dy*0.4;
  applyDrag(dx, dy); dragPx = e.clientX; dragPy = e.clientY;
});
window.addEventListener('mouseup', () => { dragging = false; });

canvas.addEventListener('wheel', e => {
  e.preventDefault(); tgtZ *= 1 + e.deltaY * 0.001; clampZ();
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  resetting = false;
  if (e.touches.length === 1) {
    dragging = true; velDx = velDy = 0;
    dragPx = e.touches[0].clientX; dragPy = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false; velDx = velDy = 0;
    pinchDist0 = touchDist(e); pinchAngle0 = touchAngle(e); pinchZ0 = curZ;
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - dragPx, dy = e.touches[0].clientY - dragPy;
    velDx = velDx*0.6 + dx*0.4; velDy = velDy*0.6 + dy*0.4;
    applyDrag(dx, dy); dragPx = e.touches[0].clientX; dragPy = e.touches[0].clientY;
  } else if (e.touches.length === 2 && pinchDist0 > 0) {
    const dist = touchDist(e), angle = touchAngle(e);
    tgtZ = pinchZ0 * (pinchDist0 / dist); clampZ();
    applyTwist(angleDelta(angle, pinchAngle0)); pinchAngle0 = angle;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (e.touches.length === 0) dragging = false;
  if (e.touches.length < 2)   pinchDist0 = 0;
  if (e.touches.length === 1) {
    dragging = true; velDx = velDy = 0;
    dragPx = e.touches[0].clientX; dragPy = e.touches[0].clientY;
  }
}, { passive: true });

document.getElementById('invertBtn').addEventListener('click', () => {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  const bg = isLight ? 0xffffff : 0x000000;
  const fg = isLight ? 0x000000 : 0xffffff;
  scene.background = new THREE.Color(bg);
  sphereMat.color.set(bg); borderMat.color.set(fg); outlineMat.color.set(fg);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (resetting) return;
  velDx = velDy = 0;
  resetTargetQ = computeSmartResetQ();
  resetting = true; resetT = 0;
  resetFromQ.copy(globeQ); resetFromZ = curZ; dragging = false;
});

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  defZ = calcDefaultZ(); tgtZ = defZ; curZ = defZ; camera.position.z = curZ;
  updateInfoBoxWidth();
}
window.addEventListener('resize', onResize);

// ── Render loop ───────────────────────────────────────────────────────────────
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function tick() {
  requestAnimationFrame(tick);
  if (resetting) {
    resetT = Math.min(1, resetT + 0.022);
    const t = easeInOutCubic(resetT);
    globe.quaternion.slerpQuaternions(resetFromQ, resetTargetQ, t);
    globeQ.copy(globe.quaternion);
    curZ = resetFromZ + (defZ - resetFromZ) * t; tgtZ = curZ;
    if (resetT >= 1) resetting = false;
  } else {
    curZ += (tgtZ - curZ) * 0.12;
    if (!dragging && (Math.abs(velDx) + Math.abs(velDy) > 0.05)) {
      const s = (Math.PI / Math.min(innerWidth, innerHeight)) * (curZ / defZ);
      _qY.setFromAxisAngle(_axY, velDx * s); _qX.setFromAxisAngle(_axX, velDy * s);
      globeQ.premultiply(_qY).premultiply(_qX);
      globe.quaternion.copy(globeQ);
      velDx *= DAMPING; velDy *= DAMPING;
    }
  }
  camera.position.z = curZ;
  const d = curZ, zs = (GLOBE_R*GLOBE_R)/d, rs = Math.sqrt(Math.max(0, GLOBE_R*GLOBE_R - zs*zs));
  outlineRing.position.z = zs + 0.002; outlineRing.scale.set(rs, rs, 1);
  renderer.render(scene, camera);
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
onResize();
loadGeo().catch(err => {
  console.error('Geo failed:', err);
  document.getElementById('loader').classList.add('hidden');
});
loadSpeciesData().catch(err => console.warn('Species data failed:', err));
tick();
</script>
</body>
